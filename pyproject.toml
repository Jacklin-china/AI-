[project]
name = "kantoku-agent"
version = "0.0.1"
description = "监督酱：AI 漫剧副导演 —— 桌面多模态 Agent（工具调用/视觉质检/记忆/成本台账）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# 注意：当前仓库仅含规范与配置约束，不含实现代码（约定：代码由里程碑过程产出）。
