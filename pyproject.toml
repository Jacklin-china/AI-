[project]
name = "kantoku-agent"
version = "0.0.1"
description = "监督酱：AI 漫剧副导演 —— 桌面多模态 Agent（工具调用/视觉质检/记忆/成本台账）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "volcengine>=1.0.222,<2",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 排除 AI 协作工作目录：其中的 .py 是一次性取色/测量/截图脚本，
# 不属于项目源码，不应进入 lint 门禁（详见 AGENTS.md 的完成标准）。
exclude = [".workbuddy", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kantoku"]
