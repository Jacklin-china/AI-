id: comic.cinematography
name: Comic Cinematography
domain: comic
description: 根据导演计划与镜头上下文生成可编辑的摄影方案。
version: 1.2.0
required_tools: []
input_schema:
  type: object
  required: [director_plan, shot_context]
  properties:
    director_plan: {type: object}
    shot_context: {type: object}
output_schema:
  type: object
  required: [public_decision, structured_plan, creative_reason]
  properties:
    cinematography:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [complete, needs_revision, missing]}
    public_decision: {type: object}
    structured_plan: {type: object}
    creative_reason: {type: [string, 'null']}
execution_policy:
  allowed_execution_modes: [fast, professional]
  side_effects: []
  provider_binding: false
  coordinator_owned: true
  contract_only: true
knowledge_refs: [cinematography.language, cinematography.spatial-continuity, cinematography.lighting]
test_cases:
  - id: accepts_shot_context
    description: 摄影决策必须基于当前镜头上下文，而不是全量历史。
  - id: keeps_video_fields_optional
    description: 图片模式可不填写运动字段，为未来视频复用保留接口。
  - id: retains_partial_public_decision
    description: 公开摄影文字与结构化字段并存；缺失字段不伪造为完整。
handler_file: ../director/handler.py
handler: execute_cinematography
