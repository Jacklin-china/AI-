# kantoku-agent 配置模板 —— 复制为 settings.yaml 后使用（settings.yaml 已被 git 忽略）
# 真实密钥只放 .env，绝不写进本文件；本文件是配置结构的唯一事实来源。
# 规则：换模型/调参数只改这里，禁止改代码。

app:
  name: kantoku-agent
  log_level: INFO              # DEBUG / INFO / WARNING

llm:
  # 主文本模型：DeepSeek，密钥只放根目录 .env
  base_url: https://api.deepseek.com/v1
  model_chat: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  chat_extra_body: {}

  # 视觉理解：火山方舟豆包多模态；即梦 AK/SK 只用于下方 Visual API 生图。
  vision_base_url: https://ark.cn-beijing.volces.com/api/v3
  model_vision: doubao-seed-2-0-lite-260428
  vision_api_key_env: ARK_API_KEY
  vision_extra_body: {}
  vision_max_tokens: 512       # 质检只返回短 JSON，限制输出成本
  vision_max_image_bytes: 10485760

  # ── 降级位：跨供应商才是真降级（08 风险登记册 R4）──────────────────
  fallback_base_url: https://open.bigmodel.cn/api/paas/v4
  fallback_model_chat: glm-4.6
  fallback_api_key_env: BIGMODEL_API_KEY
  fallback_extra_body: {}

  # 备选速查（改上面几行即可切换，代码一行不动）：
  #   DeepSeek → base_url: https://api.deepseek.com
  #               model_chat: deepseek-flash
  #               api_key_env: DEEPSEEK_API_KEY
  #               chat_extra_body: {thinking: {type: disabled}}
  #               小额验收前先核对官方型号/价格，限制输出；不要覆盖原配置。
  #   混元 Hy4  → base_url: https://api.hunyuan.tencent.com/v1
  #               model_chat: hunyuan-hy4-preview（1M 上下文 / 慢思考，无视觉）
  #   OpenRouter→ base_url: https://openrouter.ai/api/v1
  #               model_chat: volcengine/doubao-seed-2.1-turbo

  # 其他供应商速查（改上面几行即可切换，代码一行不动）：
  #   OpenRouter → base_url: https://openrouter.ai/api/v1
  #                model_chat: tencent/hy4-preview
  #                api_key_env: OPENROUTER_API_KEY
  #   本地 vLLM  → base_url: http://127.0.0.1:8000/v1
  #                model_chat: hy4-preview（需 8 卡，个人不现实）
  #   智谱       → base_url: https://open.bigmodel.cn/api/paas/v4
  #                model_chat: glm-4.6

  temperature: 1.0
  structured_temperature: 1.0
  max_tokens: 4096
  timeout_s: 60
  retry: 2
  retry_backoff_s: 1
  chat_use_temperature: false
  chat_max_tokens_parameter: max_tokens
  vision_use_temperature: false
  vision_max_tokens_parameter: max_tokens
  fallback_use_temperature: true
  fallback_max_tokens_parameter: max_tokens

image:
  provider: alibaba-qwen-image
  # 将 workspace-id-required 替换成百炼控制台的真实业务空间 ID；通用地址不支持此模型。
  base_url:  https://ws-043re2e5ss4pje8w.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  model: qwen-image-3.0
  api_key_env: DASHSCOPE_API_KEY
  quality: medium
  output_format: png
  width: 2560                   # 总像素低于 Qwen 3.0 的 2048×2048 上限
  height: 1440
  force_single: true            # 防止一次返回多张而扩大账单
  prompt_max_chars: 4000        # 长提示词需为定向返工保留上下文，由具体供应商最终校验
  timeout_s: 600                # Qwen OpenAI 兼容接口同步返回图片 URL
  query_retry: 2                # 只重试查询；付费提交永不自动重提
  query_backoff_s: 2
  output_dir: data/images
  pricing:                     # 精准计价：每张图的公示单价（元），按模型区分；审批卡片按此 × 张数展示
    default_cny_per_image: 0.18        # 北京地域 Qwen 标准版文生图公示价；以控制台账单为准
    cny_per_image_by_model:
      qwen-image-3.0: 0.18

budget:                        # 成本红线：任何付费调用前必须检查（docs/01 §5）
  accounting_utc_offset_hours: 8  # 单日预算按北京时间自然日计算
  image_credit_cny: 0.10       # 兜底估价口径：1 积分按 0.10 元（仅在 image.pricing 未配置时使用）
  image_estimated_credits_per_call: 3  # 兜底：普通图按截图区间上限预占；高质量模式须传真实估算
  image_estimated_cny_per_call: 3.00  # 兜底保守估价：仅在 image.pricing 未配置时生效；真实调用仍要求人工确认上界
  image_daily_cny: 20.0        # 当前单条视频硬上限；同日只跑一条时等于视频上限
  image_project_cny: 20.0      # 单视频项目上限
  image_episode_cny: 20.0      # 当前一条视频按一集核算
  image_shot_cny: 3.0          # 单次保守上界；项目总预算仍限制为 20 元
  image_conversation_cny: 5.0  # 首页聊天额度；不沿用专业项目/单镜预算身份
  autonomous_image_auto_cny: 0.30  # 首页单次小额生成静默执行阈值
  image_max_concurrency: 1     # W4 先串行；确认限流与整批预占正确后才调高
  token_daily_limit: 200000    # token 单日上限，防跑飞

storage:
  sqlite_path: data/kantoku.db # 项目库/台账/素材索引同一个库

commerce:
  data_mode: production       # production 无真实 Source 时阻断；demo 才启用 Mock Data
  image_mode: mock            # real 时仍先经过验收上限和统一预算控制
  text_mode: mock             # real 时复用 Core LLM
  real_image_acceptance_max_fen: 30
  marketplace: Ozon Mock Marketplace

runtime:
  max_reworks: 1               # Domain 返工硬上限，防止 Workflow 无限循环
  batch_max_concurrency: 2     # Core Batch 本机并发上限

video:
  enabled: false               # 默认关闭；本轮仅提供显式 Mock Provider
  provider: mock
  model: mock-video-v1
  timeout_s: 30
  retry: 1                     # Provider 网络层重试，不与 Workflow retry 叠乘
  estimated_fen: 1
  max_fen: 1
  output_dir: data/videos

vtuber:
  base_url: ws://localhost:12393  # Open-LLM-VTuber 后端地址，W10 可选
